<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>比奇堡散步 3D</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2a8fc0;font-family:system-ui,"Microsoft JhengHei",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block}
  #hud{position:fixed;top:12px;left:16px;color:#fff;font-weight:800;font-size:20px;text-shadow:0 2px 0 #0007;pointer-events:none}
  #swap{position:fixed;top:46px;left:16px;border:none;border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px;background:#ffd23f;color:#5a3d00;box-shadow:0 3px 0 #c79a00;cursor:pointer}
  #fade{position:fixed;inset:0;background:#0a0618;opacity:0;pointer-events:none}
  #help{position:fixed;top:14px;right:16px;color:#ffffffcc;font-size:13px;text-align:right;text-shadow:0 1px 0 #0007;pointer-events:none}
  #prompt{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#fff;color:#333;padding:8px 18px;border-radius:999px;font-weight:700;display:none;box-shadow:0 4px 0 #0003;white-space:nowrap;pointer-events:none}
  #dialog{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(560px,calc(100% - 32px));background:#fffbe6;border:4px solid #f4b400;border-radius:16px;padding:14px 18px;display:none;box-sizing:border-box;cursor:pointer}
  #dialog h3{margin:0 0 6px;color:#b35c00;font-size:18px}
  #dialog p{margin:0;font-size:17px;line-height:1.55;color:#333}
  #dialog small{display:block;text-align:right;color:#a08a50;margin-top:6px}
  #act{position:fixed;right:20px;bottom:24px;width:76px;height:76px;border-radius:50%;border:none;background:#ffd23f;color:#5a3d00;font-size:17px;font-weight:800;box-shadow:0 5px 0 #c79a00;display:none}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#fff;font-size:18px;text-align:center;padding:24px}
</style>
</head>
<body>
<div id="hud">🪼 水母：0</div>
<button id="swap"></button>
<div id="fade"></div>
<div id="help">方向鍵 / WASD 移動・E 或空白鍵 互動・C 換角色<br>滾輪 拉近拉遠・按住 Shift 移動滑鼠 轉視角・R 視角歸位<br>沿著大路往右、再往下走，可以到蟹堡王；海之霸在馬路對面，從岔路進去<br>沿著大路往左走到底，是珊迪的樹屋；過了樹屋右轉進小路，走到底是水母田<br>大路再往左走很遠，是泡芙老師的駕訓班<br>走到車子旁邊按 E 上車，再按一次下車<br>手機：拖曳畫面移動</div>
<div id="prompt"></div>
<div id="dialog"><h3></h3><p></p><small>點一下 / 空白鍵 繼續 ▶</small></div>
<button id="act">拜訪</button>
<div id="err">3D 函式庫載入失敗，請確認有連上網路再重新整理。</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if (typeof THREE === 'undefined') { document.getElementById('err').style.display = 'flex'; throw new Error('three.js missing'); }

const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;

// ---- 場景 ----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#7fe6d0');
scene.fog = new THREE.Fog('#7fe6d0', 45, 140);
const camera = new THREE.PerspectiveCamera(45, 1, 0.5, 500);
const CAM_OFF = new THREE.Vector3(0, 15, 14);

scene.add(new THREE.HemisphereLight('#ffffff', '#c9b88a', 0.72));
const sun = new THREE.DirectionalLight('#fff4dd', 0.45);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 80 });
scene.add(sun, sun.target);

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const mat = (c, extra) => new THREE.MeshLambertMaterial({ color: c, ...extra });
function add(parent, geo, color, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, color.isMaterial ? color : mat(color));
  m.position.set(x, y, z); m.castShadow = true;
  parent.add(m); return m;
}

// ---- 地面與道路（照卡通：一條灰藍色的路從三間房子前面橫過去，到右邊彎向鏡頭）----
const ground = add(scene, new THREE.PlaneGeometry(800, 800), '#ead7a2');
ground.rotation.x = -Math.PI / 2; ground.castShadow = false; ground.receiveShadow = true;

const ROAD_W = 6, BOUNDS = { x0: -310, x1: 50, z0: -38, z1: 134 };   // 可走範圍
const ROAD_CTRL = [[-370, 12], [-305, 30], [-250, 36], [-190, 29], [-135, 17], [-108, 11.5], [-82, 8.8], [-63, 7.6], [-48, 7], [-28, 8.5], [-8, 10], [8, 10.5], [20, 13], [29, 21], [34, 32], [36, 48], [36, 62], [31, 75], [18, 81], [0, 82], [-25, 83], [-50, 84]];
// 把幾個控制點連成一條平滑的曲線（Catmull-Rom），取樣成很多小段
const roadPts = [];
for (let i = 0; i < ROAD_CTRL.length - 1; i++) {
  const p0 = ROAD_CTRL[Math.max(0, i - 1)], p1 = ROAD_CTRL[i], p2 = ROAD_CTRL[i + 1], p3 = ROAD_CTRL[Math.min(ROAD_CTRL.length - 1, i + 2)];
  for (let s = 0; s < 8; s++) {
    const t = s / 8, t2 = t * t, t3 = t2 * t;
    const f = k => 0.5 * (2 * p1[k] + (p2[k] - p0[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (3 * p1[k] - p0[k] - 3 * p2[k] + p3[k]) * t3);
    roadPts.push({ x: f(0), z: f(1) });
  }
}
roadPts.push({ x: ROAD_CTRL[ROAD_CTRL.length - 1][0], z: ROAD_CTRL[ROAD_CTRL.length - 1][1] });

function distToRoad(p) {
  let best = Infinity;
  for (let i = 0; i < roadPts.length - 1; i++) {
    const a = roadPts[i], b = roadPts[i + 1], dx = b.x - a.x, dz = b.z - a.z;
    const t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.z - a.z) * dz) / (dx * dx + dz * dz)));
    best = Math.min(best, Math.hypot(p.x - a.x - dx * t, p.z - a.z - dz * t));
  }
  return best;
}
const roadZFar = x => roadPts.slice(0, 40).reduce((b, p) => Math.abs(p.x - x) < Math.abs(b.x - x) ? p : b).z;   // 延長出去的那一段
const roadZAt = x => roadPts.slice(64, 120).reduce((b, p) => Math.abs(p.x - x) < Math.abs(b.x - x) ? p : b).z;

// 沿著一串點鋪一條有寬度的帶子
function ribbon(pts, halfW, y, color) {
  const pos = [], idx = [];
  pts.forEach((p, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    const len = Math.hypot(b.x - a.x, b.z - a.z), nx = -(b.z - a.z) / len, nz = (b.x - a.x) / len;
    pos.push(p.x + nx * halfW, y, p.z + nz * halfW, p.x - nx * halfW, y, p.z - nz * halfW);
    if (i) idx.push(2 * i - 2, 2 * i - 1, 2 * i, 2 * i - 1, 2 * i + 1, 2 * i);
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  const m = add(scene, g, mat(color, { side: THREE.DoubleSide }));
  m.castShadow = false; m.receiveShadow = true;
  return m;
}
ribbon(roadPts, ROAD_W / 2 + 0.35, 0.02, '#4f6b70');
ribbon(roadPts, ROAD_W / 2, 0.04, '#7f9da0');

// ---- 天空：上藍下青綠的漸層 + 一朵一朵用粗線畫的花 ----
// 做成一顆包住整個世界的大球，內側貼上畫好的天空；球跟著鏡頭走，所以永遠走不到邊
const skyTex = canvasTex(2048, 1024, (c, w, h) => {
  const g = c.createLinearGradient(0, 0, 0, h / 2);
  g.addColorStop(0, '#1f7fe0'); g.addColorStop(0.5, '#27a8e8'); g.addColorStop(0.8, '#3fd0d8'); g.addColorStop(1, '#7fe6d0');
  c.fillStyle = g; c.fillRect(0, 0, w, h / 2);
  c.fillStyle = '#7fe6d0'; c.fillRect(0, h / 2, w, h / 2);         // 地平線以下跟遠處的霧同一個顏色
  const rnd = i => { const v = Math.sin(i * 127.1) * 43758.5453; return v - Math.floor(v); };
  const cols = ['#d6e23a', '#3a5fe0', '#5a4fd8', '#3fc8a0', '#f07fa8', '#f0a050'];
  c.lineCap = c.lineJoin = 'round';
  for (let i = 0; i < 20; i++) {
    // 一朵花 = 一條封閉的線：五（或六）片圓圓胖胖的花瓣連在一起、每片長短不太一樣，中間再一個小圈
    const R = 55 + rnd(i * 3 + 1) * 85, n = rnd(i * 3 + 2) < 0.75 ? 5 : 6;
    const x = (i + 0.2 + 0.6 * rnd(i * 5)) / 20 * w, y = h * (0.12 + 0.3 * rnd(i * 7 + 3)), rot = rnd(i * 11) * 6.28;
    const p1 = rnd(i * 13) * 6.28, p2 = rnd(i * 17) * 6.28;
    c.strokeStyle = cols[i % cols.length]; c.globalAlpha = 0.8; c.lineWidth = R * 0.085;
    c.beginPath();
    for (let k = 0; k <= 160; k++) {
      const th = k / 160 * 6.2832, lobe = Math.pow(0.5 + 0.5 * Math.cos(n * th), 0.6);
      const len = 1 + 0.2 * Math.sin(th + p1) + 0.12 * Math.sin(2 * th + p2);
      const r = R * (0.3 + 0.62 * lobe * len);
      c.lineTo(x + Math.cos(th + rot) * r, y + Math.sin(th + rot) * r);
    }
    c.closePath(); c.stroke();
    c.beginPath(); c.arc(x, y, R * 0.11, 0, 6.2832); c.stroke();
  }
  c.globalAlpha = 1;
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 48, 28), new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false }));
scene.add(sky);

// ---- 房子 ----
function buildPineapple() {
  const g = new THREE.Group();
  const RX = 3, RY = 4.2, CY = 3;                    // 橢圓球：底部埋進地面一點，站得比較穩
  const zAt = (x, y) => RX * Math.sqrt(1 - (x / RX) ** 2 - ((y - CY) / RY) ** 2);
  add(g, new THREE.SphereGeometry(RX, 36, 26), '#ee8a1a', 0, CY, 0).scale.y = RY / RX;

  // 菱格紋：兩個方向的斜線繞著鳳梨螺旋而上，交叉成菱形
  const lineMat = mat('#a8400a');
  for (let k = 0; k < 10; k++) for (const dir of [-1, 1]) {
    const pts = [];
    for (let i = 0; i <= 24; i++) {
      const phi = 0.12 + (Math.PI - 0.5) * i / 24, az = k * TAU / 10 + dir * phi * 0.9, R = RX * 1.004 * Math.sin(phi);
      pts.push(new THREE.Vector3(R * Math.sin(az), CY + RY * 1.004 * Math.cos(phi), R * Math.cos(az)));
    }
    add(g, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 48, 0.04, 5), lineMat).castShadow = false;
  }

  // 葉子：中間一片直立，往外兩圈越來越斜，每片是寬寬扁扁的尖葉
  const leafCols = ['#4f9a2a', '#3c8420', '#6ab53a'];
  const leaf = (az, tilt, len, i) => {
    const pivot = new THREE.Group(); pivot.position.set(0, CY + RY - 0.5, 0); pivot.rotation.y = az; g.add(pivot);
    const m = add(pivot, new THREE.ConeGeometry(0.75, len, 8), leafCols[i % 3], Math.sin(tilt) * len / 2, Math.cos(tilt) * len / 2, 0);
    m.rotation.z = -tilt; m.scale.x = 0.4;
  };
  leaf(0, 0, 4.4, 0);
  for (let i = 0; i < 6; i++) leaf(i * TAU / 6 + 0.3, 0.42, 4, i + 1);
  for (let i = 0; i < 8; i++) leaf(i * TAU / 8, 0.9, 3.2, i);

  // 圓形舷窗：藍色窗框 + 一圈鉚釘，貼著鳳梨表面朝外
  const porthole = (x, y, r) => {
    const z = zAt(x, y), w = new THREE.Group();
    w.position.set(x, y, z); g.add(w);
    w.lookAt(x + x / (RX * RX), y + (y - CY) / (RY * RY), z + z / (RX * RX));
    add(w, new THREE.TorusGeometry(r, r * 0.22, 10, 24), '#7f9fd0', 0, 0, 0.05);
    add(w, new THREE.CylinderGeometry(r * 0.95, r * 0.95, 0.12, 24), '#a8dcf0').rotation.x = Math.PI / 2;
    for (let i = 0; i < 6; i++) add(w, new THREE.SphereGeometry(r * 0.09, 6, 5), '#5f7fb0', Math.cos(i * TAU / 6) * r, Math.sin(i * TAU / 6) * r, 0.05 + r * 0.22);
  };
  porthole(-1.35, 4.9, 0.62);
  porthole(1.6, 3.0, 0.52);

  // 拱形的藍色門：門框往外凸出來，門板上有船舵小窗和門把
  const FRAME = '#7f9fd0', DOOR = '#a9c4e8';
  add(g, new THREE.BoxGeometry(1.7, 1.7, 1.9), FRAME, 0, 0.85, 2.25);
  add(g, new THREE.CylinderGeometry(0.85, 0.85, 1.9, 24), FRAME, 0, 1.7, 2.25).rotation.x = Math.PI / 2;
  add(g, new THREE.BoxGeometry(1.3, 1.65, 0.1), DOOR, 0, 0.83, 3.2);
  add(g, new THREE.CylinderGeometry(0.65, 0.65, 0.1, 24), DOOR, 0, 1.66, 3.2).rotation.x = Math.PI / 2;
  add(g, new THREE.TorusGeometry(0.3, 0.06, 8, 20), FRAME, 0, 1.55, 3.27);
  for (let i = 0; i < 4; i++) add(g, new THREE.BoxGeometry(0.6, 0.05, 0.04), FRAME, 0, 1.55, 3.27).rotation.z = i * Math.PI / 4;
  add(g, new THREE.SphereGeometry(0.07, 8, 6), '#e8c15a', 0.45, 0.9, 3.28);

  // 右上方彎出來的煙囪管
  const PIPE = '#8fa8d0';
  add(g, new THREE.CylinderGeometry(0.24, 0.24, 1.2, 12), PIPE, 2.75, 5.2, 0.5).rotation.z = Math.PI / 2;
  add(g, new THREE.SphereGeometry(0.25, 10, 8), PIPE, 3.35, 5.2, 0.5);
  add(g, new THREE.CylinderGeometry(0.24, 0.24, 1, 12), PIPE, 3.35, 5.7, 0.5);
  add(g, new THREE.CylinderGeometry(0.36, 0.26, 0.35, 12), PIPE, 3.35, 6.3, 0.5);

  // 門兩邊的小花叢
  const bushCols = ['#f2c22e', '#e8503a', '#6ab53a', '#f08fb0'];
  for (const s of [-1, 1]) for (let i = 0; i < 7; i++) {
    const a = s * (0.55 + i * 0.16);
    add(g, new THREE.SphereGeometry(0.22 + (i % 3) * 0.06, 8, 6), bushCols[i % 4], Math.sin(a) * 2.5, 0.2, Math.cos(a) * 2.5);
  }
  return g;
}
// 有顆粒感的石頭 / 筆觸感的岩石貼圖：底色上灑一堆深淺不一的小點或短筆觸
function speckleTex(base, dots, n, stroke) {
  const t = canvasTex(256, 256, (c, w, h) => {
    c.fillStyle = base; c.fillRect(0, 0, w, h);
    const rnd = i => { const v = Math.sin(i * 127.1) * 43758.5453; return v - Math.floor(v); };
    for (let i = 0; i < n; i++) {
      c.fillStyle = dots[i % dots.length]; c.globalAlpha = 0.35 + 0.4 * rnd(i * 3);
      const x = rnd(i * 5 + 1) * w, y = rnd(i * 7 + 2) * h, r = 1.5 + rnd(i * 11 + 3) * 3.5;
      c.beginPath();
      if (stroke) c.ellipse(x, y, r * 5, r * 1.3, rnd(i * 13) * 3.14, 0, 6.2832); else c.arc(x, y, r, 0, 6.2832);
      c.fill();
    }
    c.globalAlpha = 1;
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

function buildMoai() {
  // 章魚哥的家：上窄下寬的藍色石像。整塊橫的眉骨、兩個圓舷窗當眼睛、上窄下寬的長鼻子、兩側長耳朵、拱形木門
  const g = new THREE.Group();
  const H = 7.6, RT = 1.75, RB = 2.5, rAt = y => RB - (RB - RT) * y / H;
  const tex = speckleTex('#4f80b4', ['#5a8abc', '#4776aa', '#5384b6'], 900);
  tex.repeat.set(2, 2);
  const stone = c => new THREE.MeshLambertMaterial({ map: tex, color: c });
  const BODY = stone('#c9d6ea'), PART = stone('#ffffff'), SHADE = stone('#a9b9d4');

  add(g, new THREE.CylinderGeometry(RT, RB, H, 32), BODY, 0, H / 2, 0);
  add(g, new THREE.CylinderGeometry(RT - 0.12, RT, 0.14, 32), SHADE, 0, H + 0.07, 0);          // 頭頂稍微收邊，不是銳利的切面

  // 眉骨：一整塊橫的石板，比頭還寬，往前凸出來
  add(g, new THREE.BoxGeometry(4.7, 0.62, 1.5), PART, 0, 5.25, 1.45);
  // 鼻子：上窄下寬的長石板，從眉骨下面一路到門的上面
  const ns = new THREE.Shape();
  ns.moveTo(-0.62, 0); ns.lineTo(0.62, 0); ns.lineTo(0.3, 2.65); ns.lineTo(-0.3, 2.65); ns.lineTo(-0.62, 0);
  add(g, new THREE.ExtrudeGeometry(ns, { depth: 0.9, bevelEnabled: true, bevelSize: 0.05, bevelThickness: 0.05, bevelSegments: 2 }), PART, 0, 2.3, 1.75);
  // 耳朵：兩側各一塊長石板
  for (const s of [-1, 1]) add(g, new THREE.BoxGeometry(0.75, 2.7, 1.4), SHADE, s * (rAt(3.9) + 0.22), 3.9, -0.1);

  // 眼睛：兩個圓舷窗（藍色窗框、淺藍玻璃、四顆鉚釘，玻璃是純色的），貼著石像表面稍微朝外
  for (const s of [-1, 1]) {
    const x = s * 0.95, y = 4.45, z = Math.sqrt(rAt(y) ** 2 - x * x), w = new THREE.Group();
    w.position.set(x, y, z + 0.02); g.add(w); w.lookAt(x * 2, y, z * 2 + 0.02);
    add(w, new THREE.CylinderGeometry(0.62, 0.62, 0.22, 24), '#2f5fb0').rotation.x = Math.PI / 2;
    add(w, new THREE.TorusGeometry(0.55, 0.13, 10, 24), '#4f86e0', 0, 0, 0.1);
    add(w, new THREE.CylinderGeometry(0.44, 0.44, 0.06, 24), '#9fd4ff', 0, 0, 0.12).rotation.x = Math.PI / 2;
    for (let i = 0; i < 4; i++) add(w, new THREE.SphereGeometry(0.05, 6, 5), '#2f5fb0', Math.cos(i * TAU / 4 + 0.78) * 0.55, Math.sin(i * TAU / 4 + 0.78) * 0.55, 0.23);
  }

  // 拱形木門：直條木板、深色門框、金色門把
  const dz = rAt(0.2) - 0.08;
  add(g, new THREE.BoxGeometry(1.75, 1.6, 0.3), '#2a4670', 0, 0.8, dz);
  add(g, new THREE.CylinderGeometry(0.875, 0.875, 0.3, 28), '#2a4670', 0, 1.6, dz).rotation.x = Math.PI / 2;
  add(g, new THREE.BoxGeometry(1.45, 1.6, 0.3), '#c98a3c', 0, 0.8, dz + 0.1);
  add(g, new THREE.CylinderGeometry(0.725, 0.725, 0.3, 28), '#c98a3c', 0, 1.6, dz + 0.1).rotation.x = Math.PI / 2;
  for (const x of [-0.36, 0, 0.36]) add(g, new THREE.BoxGeometry(0.03, 2.1 - Math.abs(x) * 0.6, 0.02), '#8a5a22', x, 1.05 - Math.abs(x) * 0.3, dz + 0.26).castShadow = false;
  add(g, new THREE.SphereGeometry(0.09, 10, 8), '#f2c22e', 0.45, 0.85, dz + 0.3);
  return g;
}

function buildRock() {
  // 派大星的家：一顆紅棕色的圓頂大石頭，頂上插著金黃色的竹節風向標
  const g = new THREE.Group();
  add(g, new THREE.SphereGeometry(3.4, 36, 18, 0, TAU, 0, Math.PI / 2), '#6e3a2c').scale.y = 0.82;
  add(g, new THREE.TorusGeometry(3.4, 0.13, 6, 40), '#44241a', 0, 0.02, 0).rotation.x = Math.PI / 2;

  const GOLD = '#e8b424', JOINT = '#b8860f', top = 3.4 * 0.82;

function spline(ctrl, n) {                           // 把幾個控制點連成平滑曲線
  const out = [];
  for (let i = 0; i < ctrl.length - 1; i++) {
    const p0 = ctrl[Math.max(0, i - 1)], p1 = ctrl[i], p2 = ctrl[i + 1], p3 = ctrl[Math.min(ctrl.length - 1, i + 2)];
    for (let s = 0; s < n; s++) {
      const t = s / n, t2 = t * t, t3 = t2 * t;
      const f = k => 0.5 * (2 * p1[k] + (p2[k] - p0[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (3 * p1[k] - p0[k] - 3 * p2[k] + p3[k]) * t3);
      out.push({ x: f(0), z: f(1) });
    }
  }
  out.push({ x: ctrl[ctrl.length - 1][0], z: ctrl[ctrl.length - 1][1] });
  return out;
}

    const rr = rAt(y) + 0.01 - dentAt(a, y, rAt(y)), x = Math.sin(a) * rr, z = Math.cos(a) * rr;
    const p = add(g, new THREE.SphereGeometry(r, 12, 8), m, x, y, z);

function buildPatrick() {
  const root = new THREE.Group(), rig = new THREE.Group();
  root.add(rig);
  const P = '#f58f8f', SHORTS = '#b0dc20', ZS = 0.78;
  // 頭頂往一邊歪：越高的地方往旁邊推越多，臉上的東西也跟著同一條曲線移
  const lean = y => 0;

  // 身體：肚子寬、肩膀往內收、上面是細細的尖頭（輪廓線轉一圈）
  const BODY = [[0, 0.32], [0.42, 0.36], [0.62, 0.6], [0.67, 0.9], [0.65, 1.15], [0.56, 1.42], [0.44, 1.65], [0.36, 1.9], [0.29, 2.15], [0.2, 2.45], [0.1, 2.75], [0, 2.9]];
  const body = lathe(BODY, P);
  const pos = body.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setX(i, pos.getX(i) + lean(pos.getY(i)));
  // 低腰短褲，肚子掛在褲頭上面
  const SH = [[0, 0.3], [0.44, 0.34], [0.64, 0.59], [0.695, 0.86], [0.69, 1.0], [0.675, 1.04]];
  const shorts = lathe(SH, SHORTS);
  for (const m of [body, shorts]) { m.scale.z = ZS; m.castShadow = true; rig.add(m); }

  // 短褲上的紫色色塊：每塊是一整片不規則的形狀（邊緣有幾個大小不一的圓凸），直接鋪在褲子的曲面上；
  // 超出褲頭或褲底的部分會被壓平在邊緣，看起來像被切掉
  const shortsR = y => {
    const i = SH.findIndex(p => p[1] >= y), [r0, y0] = SH[i - 1], [r1, y1] = SH[i];
    return r0 + (r1 - r0) * (y - y0) / (y1 - y0);
  };
  const rnd = x => { const v = Math.sin(x * 127.1) * 43758.5453; return v - Math.floor(v); };
  const blotchMat = mat('#8f5fc4', { side: THREE.DoubleSide });
  for (const [a0, y0, R, seed] of [[0.25, 1.0, 0.36, 1], [-0.9, 0.5, 0.36, 2], [1.5, 0.52, 0.34, 3], [3.3, 1.0, 0.36, 4], [4.45, 0.55, 0.34, 5]]) {
    const lobes = Array.from({ length: 5 }, (_, i) => [i * TAU / 5 + (rnd(seed * 7 + i) - 0.5) * 0.5, 0.65 + 0.35 * rnd(seed * 13 + i)]);
    const edge = th => R * (0.58 + 0.45 * Math.max(...lobes.map(([t, amp]) => {
      const d = Math.atan2(Math.sin(th - t), Math.cos(th - t));
      return amp * Math.exp(-((d / 0.5) ** 2));
    })));
    const N = 64, RINGS = 8, pos = [], idx = [], r0 = shortsR(y0);
    const put = (u, v) => {                                   // u：沿著褲子繞的距離，v：上下
      const y = Math.max(0.37, Math.min(1.035, y0 + v)), a = a0 + u / r0, r = shortsR(y) * 1.007;
      pos.push(Math.sin(a) * r, y, Math.cos(a) * r * ZS);
    };
    put(0, 0);
    for (let k = 1; k <= RINGS; k++) for (let i = 0; i < N; i++) {
      const th = i / N * TAU, d = edge(th) * k / RINGS;
      put(Math.cos(th) * d, Math.sin(th) * d);
    }
    for (let i = 0; i < N; i++) {
      const j = (i + 1) % N;
      idx.push(0, 1 + i, 1 + j);
      for (let k = 1; k < RINGS; k++) {
        const A = 1 + (k - 1) * N, B = 1 + k * N;
        idx.push(A + i, B + i, B + j, A + i, B + j, A + j);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx); g.computeVertexNormals();
    add(rig, g, blotchMat).castShadow = false;
  }
  // 肚臍 + 身上的小紅點
  add(rig, new THREE.TorusGeometry(0.04, 0.012, 6, 10, Math.PI), '#d9605c', 0.03, 1.16, 0.655 * ZS).rotation.z = Math.PI;
  // 小疙瘩：用「繞身體的角度 + 高度」決定位置，直接貼在身體表面上（角度 0 是正面，3.14 是背面）
  const radiusAt = y => {
    const i = BODY.findIndex(p => p[1] >= y), [r0, y0] = BODY[i - 1], [r1, y1] = BODY[i];
    return r0 + (r1 - r0) * (y - y0) / (y1 - y0);
  };
  for (const [a, y] of [
    [0.55, 2.48], [-0.6, 2.6],          // 頭
    [-0.9, 1.5], [-0.68, 1.6],          // 左肩
    [0.9, 1.52], [0.7, 1.62],           // 右肩
    [0.8, 1.16],                        // 肚子側邊
    [2.7, 1.55], [3.5, 2.3],            // 背面
  ]) {
    const r = radiusAt(y);
    add(rig, new THREE.SphereGeometry(0.024, 8, 6), '#e2605c', Math.sin(a) * r + lean(y), y, Math.cos(a) * r * ZS);
  }

  // 臉（比上一版小）：兩顆貼在一起的直立眼睛、小黑瞳孔、飄在上面的粗眉毛
  for (const s of [-1, 1]) {
    const ex = s * 0.11 + lean(2.12);
    add(rig, new THREE.SphereGeometry(0.14, 18, 14), '#ffffff', ex, 2.12, 0.21).scale.set(0.8, 1.15, 0.5);
    add(rig, new THREE.SphereGeometry(0.035, 10, 8), '#0a0a0a', ex - s * 0.025, 2.11, 0.275).scale.z = 0.5;
    add(rig, new THREE.BoxGeometry(0.13, 0.04, 0.04), '#1a1a1a', s * 0.115 + lean(2.36), 2.36, 0.16).rotation.z = s * -0.22;
  }
  // 笑嘴（半個碗的形狀貼在臉上）+ 舌頭
  const mouth = add(rig, new THREE.SphereGeometry(0.19, 20, 10, 0, TAU, Math.PI / 2, Math.PI / 2), mat('#8a1a2a', { side: THREE.DoubleSide }), lean(1.9), 1.9, 0.245);
  mouth.scale.z = 0.45; mouth.rotation.x = -0.36;
  add(rig, new THREE.SphereGeometry(0.07, 12, 8), '#f58a94', lean(1.78), 1.78, 0.33).scale.set(1.2, 0.7, 0.4);

  // 手和腳：根部粗、尾端收窄，但尾巴是圓的，不是尖的
  const arms = [], legs = [];
  for (const s of [-1, 1]) {
    const arm = new THREE.Group(); arm.position.set(s * 0.064, 1.687, 0); rig.add(arm);
    const a = add(arm, new THREE.CylinderGeometry(0.11, 0.313, 1.15, 16), P, s * 0.46, -0.345, 0);
    a.rotation.z = -s * 2.214; a.scale.z = 0.8;
    add(arm, new THREE.SphereGeometry(0.11, 12, 10), P, s * 0.92, -0.69, 0).scale.z = 0.8;
    arms.push(arm);

    const leg = new THREE.Group(); leg.position.set(s * 0.28, 0.5, 0); root.add(leg);
    add(leg, new THREE.SphereGeometry(0.235, 14, 10), SHORTS, 0, 0.06, 0).scale.y = 0.7;
    add(leg, new THREE.CylinderGeometry(0.19, 0.1, 0.5, 12), P, 0, -0.18, 0);
    add(leg, new THREE.SphereGeometry(0.1, 10, 8), P, 0, -0.4, 0);
    add(leg, new THREE.CylinderGeometry(0.235, 0.2, 0.2, 12), SHORTS, 0, -0.02, 0);
    legs.push(leg);
  }
  root.scale.setScalar(0.8);
  return { root, rig, arms, legs, sway: 0.13, bob: 0.07, swing: 0.55, size: 0.8, hip: 0.5, armSwing: 0.45 };
}

function buildSquid() {
  // 比例照全身參考圖量的：頭約佔 1/3、上衣 1/5、腿超過 1/3（瘦瘦高高）
  const root = new THREE.Group(), rig = new THREE.Group();
  root.add(rig);
  const T = '#a5d8cc', LID = '#8cc0b3', SHIRT = '#d99a2b', INK = '#24504a';

  // 身體：窄窄的上衣、短袖、領子，衣服下面露出一小顆圓圓的屁股
  add(rig, new THREE.SphereGeometry(0.17, 16, 12), T, 0, 1.0, 0).scale.y = 0.85;
  add(rig, new THREE.CylinderGeometry(0.15, 0.175, 0.6, 16), SHIRT, 0, 1.3, 0);
  add(rig, new THREE.CylinderGeometry(0.075, 0.1, 0.07, 12), SHIRT, 0, 1.62, 0);
  add(rig, new THREE.CylinderGeometry(0.035, 0.035, 0.4, 8), T, 0, 1.78, 0);

  // 頭：橫的寬扁大腦袋，下面接一段只有一半寬的臉
  const CR = { x: 0.42, y: 0.26, z: 0.36, cy: 2.53 };
  add(rig, new THREE.SphereGeometry(0.4, 28, 20), T, 0, CR.cy, 0).scale.set(CR.x / 0.4, CR.y / 0.4, CR.z / 0.4);
  const face = lathe([[0, 1.92], [0.08, 1.925], [0.14, 1.96], [0.18, 2.02], [0.198, 2.1], [0.2, 2.2], [0.205, 2.28], [0.23, 2.35], [0.3, 2.42], [0, 2.44]], T);
  face.scale.z = 0.85; face.castShadow = true; rig.add(face);
  // 額頭的抬頭紋 + 頭頂的小斑點
  for (const [y, R, cz, arc] of [[2.58, 0.484, -0.128, 0.8], [2.66, 0.428, -0.113, 0.6]]) {
    const w = add(rig, new THREE.TorusGeometry(R, 0.007, 5, 18, arc), INK, 0, y, cz);
    w.rotation.set(Math.PI / 2, 0, (Math.PI - arc) / 2); w.castShadow = false;
  }
  for (const [x, y] of [[-0.24, 2.73], [-0.12, 2.77], [0.03, 2.78], [0.17, 2.76], [0.28, 2.71]]) {
    const z = CR.z * Math.sqrt(Math.max(0, 1 - (x / CR.x) ** 2 - ((y - CR.cy) / CR.y) ** 2));
    add(rig, new THREE.SphereGeometry(0.013, 6, 5), '#2f8a6e', x, y, z);
  }

  // 眼睛：兩顆直立的大眼，合起來跟臉一樣寬，卡在腦袋下緣；上半是比較深的眼皮
  for (const s of [-1, 1]) {
    const ex = s * 0.105, ey = 2.33, ez = 0.24;
    add(rig, new THREE.SphereGeometry(0.14, 18, 14), '#fff7b8', ex, ey, ez).scale.set(0.75, 1, 0.7);
    add(rig, new THREE.BoxGeometry(0.04, 0.06, 0.02), '#8a2a2a', ex - s * 0.02, ey - 0.04, ez + 0.094);
    add(rig, new THREE.SphereGeometry(0.147, 18, 10, 0, TAU, 0, Math.PI * 0.47), LID, ex, ey, ez).scale.set(0.75, 1, 0.7);
  }

  // 嘴部：一塊厚厚鼓鼓的橫條（不是薄盤子），兩端各一顆臉頰肉
  const MZ = { x: 0.29, y: 0.12, z: 0.15, cy: 2.0, cz: 0.1 };
  add(rig, new THREE.SphereGeometry(0.2, 22, 16), T, 0, MZ.cy, MZ.cz).scale.set(MZ.x / 0.2, MZ.y / 0.2, MZ.z / 0.2);
  for (const s of [-1, 1]) add(rig, new THREE.SphereGeometry(0.065, 14, 12), T, s * 0.28, 1.99, 0.07);
  // 嘴線：每個點都直接算在嘴部的表面上（再往外浮一點點），所以不會陷進去被擋住
  const onMuzzle = (x, y) => new THREE.Vector3(x, y,
    MZ.cz + MZ.z * Math.sqrt(Math.max(0.02, 1 - (x / MZ.x) ** 2 - ((y - MZ.cy) / MZ.y) ** 2)) + 0.006);
  const stroke = pts => { add(rig, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 28, 0.012, 6), '#1c3f3a').castShadow = false; };
  const MX = 0.235, mouthY = x => MZ.cy + 0.005 - 0.04 * (x / MX) ** 2;     // 中間高、兩端往下的長弧線
  stroke(Array.from({ length: 17 }, (_, i) => { const x = -MX + 2 * MX * i / 16; return onMuzzle(x, mouthY(x)); }));
  // 嘴角兩邊各一道短短的摺痕
  for (const s of [-1, 1]) stroke([onMuzzle(s * (MX + 0.004), mouthY(MX) + 0.03), onMuzzle(s * (MX + 0.012), mouthY(MX)), onMuzzle(s * (MX + 0.004), mouthY(MX) - 0.03)]);

  // 鼻子：從兩眼中間垂到下巴下面，上細下胖的水滴形
  const nose = lathe([[0, 0], [0.035, -0.02], [0.05, -0.1], [0.065, -0.2], [0.088, -0.3], [0.098, -0.36], [0.085, -0.42], [0.045, -0.445], [0, -0.45]], T);
  nose.position.set(0, 2.28, 0.27); nose.rotation.x = -0.12; nose.castShadow = true; rig.add(nose);

  // 細細長長的手
  const arms = [], legs = [];
  for (const s of [-1, 1]) {
    add(rig, new THREE.CylinderGeometry(0.07, 0.09, 0.2, 10), SHIRT, s * 0.22, 1.47, 0).rotation.z = s * 1.1;
    const arm = new THREE.Group(); arm.position.set(s * 0.3, 1.44, 0); rig.add(arm);
    add(arm, new THREE.CylinderGeometry(0.028, 0.028, 0.7, 8), T, 0, -0.35, 0);
    add(arm, new THREE.SphereGeometry(0.06, 10, 8), T, 0, -0.74, 0).scale.y = 1.4;
    arms.push(arm);
  }
  // 四條很長的觸手腳，相鄰的兩條反方向擺；腳掌是往前攤開的扁片
  [-0.09, -0.03, 0.03, 0.09].forEach((x, i) => {
    const leg = new THREE.Group(); leg.position.set(x, 1.0, i % 2 ? 0.04 : -0.04); root.add(leg);
    add(leg, new THREE.SphereGeometry(0.06, 10, 8), T, 0, 0, 0);
    add(leg, new THREE.CylinderGeometry(0.055, 0.034, 0.9, 10), T, 0, -0.45, 0);
    add(leg, new THREE.SphereGeometry(0.09, 10, 8), T, x * 0.8, -0.94, 0.08).scale.set(1.3, 0.45, 2.2);
    legs.push(leg);
  });
  root.scale.setScalar(0.9);
  return { root, rig, arms, legs, sway: 0.04, bob: 0.05, swing: 0.4, size: 0.9, hip: 1.0 };
}

// 走路動作：腿前後擺、手反方向擺、身體上下彈 + 左右晃
function animate(m, ph, moving, t) {
  const w = moving ? 1 : 0, swing = m.swing ?? 0.8;
  m.legs.forEach((l, i) => { l.rotation.x = Math.sin(ph + (i % 2 ? Math.PI : 0)) * swing * w; });
  const as = m.armSwing ?? 0.7;
  m.arms[0].rotation.x = -Math.sin(ph) * as * w;
  m.arms[1].rotation.x = Math.sin(ph) * as * w;
  m.rig.position.y = w ? Math.abs(Math.cos(ph)) * (m.bob ?? 0.09) : Math.sin(t * 2) * 0.015;
  m.rig.rotation.z = Math.sin(ph) * (m.sway ?? 0.07) * w;
  m.rig.rotation.x = 0.08 * w;
  // 有設定 hip 的角色：把身體移回來，讓屁股的位置固定在腿的正上方
  const hy = m.hip ?? 0;
  m.rig.position.x = hy * Math.sin(m.rig.rotation.z);
  m.rig.position.z = -hy * Math.sin(m.rig.rotation.x);
}

// ---- 小蝸：海綿寶寶出門後會慢慢跟在他後面，走過的地方留下幾秒鐘的黏液 ----
function buildGary() {
  const root = new THREE.Group();
  const BLUE = '#7fb8e8', RIM = '#b8d84a', SHELL = '#f08a8a', EYE = '#c8e06a';

  // 貼地的身體：從尾巴到頭排成一串扁扁的節，走路時一節一節輪流伸縮（下面一圈黃綠色的裙邊跟著動）
  const segs = [];
  for (let i = 0; i < 9; i++) {
    const z = -0.75 + i * 0.19, w = 0.75 + 0.5 * Math.sin((i + 1) / 10 * Math.PI);     // 兩頭窄、中間寬
    const body = add(root, new THREE.SphereGeometry(0.26, 14, 10), BLUE, 0, 0.11, z);
    const rim = add(root, new THREE.SphereGeometry(0.3, 14, 8), RIM, 0, 0.05, z);
    segs.push({ body, rim, z, w });
  }
  // 頭：前端稍微抬起來
  const head = new THREE.Group(); head.position.set(0, 0.2, 0.8); root.add(head);
  add(head, new THREE.SphereGeometry(0.2, 14, 12), BLUE).scale.set(1.15, 0.85, 1.1);

  // 兩根細長的眼柄 + 黃綠色大眼球（紅眼珠、黑瞳孔）
  const stalks = [];
  for (const s of [-1, 1]) {
    const st = new THREE.Group(); st.position.set(s * 0.09, 0.08, -0.02); st.rotation.z = -s * 0.2; head.add(st);
    add(st, new THREE.CylinderGeometry(0.03, 0.04, 0.8, 8), BLUE, 0, 0.4, 0);
    add(st, new THREE.SphereGeometry(0.2, 18, 14), EYE, 0, 0.92, 0.03);
    const look = new THREE.Group(); look.position.set(0, 0.92, 0.03); look.rotation.y = -s * 0.12; st.add(look);   // 稍微往中間看
    for (const [r, ang, col] of [[0.204, 0.5, '#d83222'], [0.208, 0.25, '#0a0a0a']]) {
      const cap = add(look, new THREE.SphereGeometry(r, 20, 8, 0, TAU, 0, ang), col);
      cap.rotation.x = Math.PI / 2; cap.castShadow = false;
    }
    stalks.push(st);
  }

  // 粉紅色的殼：兩側各一條深紅色螺旋，上面有幾顆紫色斑點
  const shell = new THREE.Group(); shell.position.set(0, 0.7, -0.16); shell.scale.setScalar(1.25); root.add(shell);
  const SR = 0.55, SX = 0.75;
  // 花紋直接畫在殼的貼圖上：螺旋和斑點都只是顏色，殼的表面是平滑的，沒有另外凸出來的東西
  const SPOTS = [[0, 1, 0.15, 0.13], [0.55, 0.75, 0.4, 0.09], [-0.55, 0.75, 0.35, 0.09], [0.5, 0.7, -0.5, 0.1], [-0.5, 0.7, -0.5, 0.1], [0, 0.6, -0.8, 0.11]]
    .map(([x, y, z, r]) => { const n = Math.hypot(x, y, z); return [x / n, y / n, z / n, Math.cos(r * 1.25 / SR)]; });
  const shellTex = canvasTex(1024, 512, (c, w, h) => {
    c.fillStyle = SHELL; c.fillRect(0, 0, w, h);
    // 紫色斑點：貼圖上每一格換算回它在殼上的方向，落在斑點範圍裡就塗紫色（這樣靠近頂端也不會變形）
    c.fillStyle = '#8a6ad8';
    for (let py = 0; py < h; py++) {
      const th = (py + 0.5) / h * Math.PI, st = Math.sin(th), wy = Math.cos(th);
      let run = -1;
      for (let px = 0; px <= w; px++) {
        const ph = (px + 0.5) / w * TAU, wx = Math.sin(ph) * st, wz = Math.cos(ph) * st;
        const hit = px < w && SPOTS.some(([x, y, z, cs]) => wx * x + wy * y + wz * z > cs);
        if (hit && run < 0) run = px;
        if (!hit && run >= 0) { c.fillRect(run, py, px - run, 1); run = -1; }
      }
    }
    // 深紅色螺旋：左右兩側各一條
    c.strokeStyle = '#8a1a2a'; c.lineWidth = 22; c.lineCap = c.lineJoin = 'round';
    for (const s of [-1, 1]) {
      c.beginPath();
      for (let i = 0; i <= 90; i++) {
        const t = i / 90, ang = 2.2 + t * 2.3 * TAU, rho = (0.05 + 0.37 * t) / SR;
        const wx = s * Math.sqrt(1 - rho * rho), wy = Math.sin(ang) * rho - 0.04, wz = Math.cos(ang) * rho;
        c.lineTo(((Math.atan2(wx, wz) / TAU) % 1 + 1) % 1 * w, Math.acos(wy) / Math.PI * h);
      }
      c.stroke();
    }
  });
  // 球轉 90 度，讓貼圖的接縫落在正前方（那裡是純粉紅色，看不出來），螺旋才能完整畫在左右兩側
  const shellMesh = add(shell, new THREE.SphereGeometry(SR, 32, 24), new THREE.MeshLambertMaterial({ map: shellTex }));
  shellMesh.rotation.y = Math.PI / 2; shellMesh.scale.z = SX;
  root.scale.setScalar(0.7);
  root.visible = false;
  scene.add(root);
  return { root, segs, head, stalks, shell };
}

// ---- 更新 ----
function update(dt, t) {
  let vx = 0, vz = 0;
  if (!dlg.open) {
    if (keys['arrowleft'] || keys['a']) vx--;
    if (keys['arrowright'] || keys['d']) vx++;
    if (keys['arrowup'] || keys['w']) vz--;
    if (keys['arrowdown'] || keys['s']) vz++;
    if (joy) { vx += joy.dx; vz += joy.dy; }
    const m = Math.hypot(vx, vz);
    if (m > 1) { vx /= m; vz /= m; }
  }
  if (!vx && !vz) moveYaw = camYaw;
  const cy = Math.cos(moveYaw), sy = Math.sin(moveYaw);
  [vx, vz] = [vx * cy + vz * sy, -vx * sy + vz * cy];
  const onRoad = distToRoad(player) < ROAD_W / 2;
  let speed = onRoad ? 9 : 7;                         // 走在路上比較快
  if (driving) {
    // 開車：方向鍵決定想去的方向，車頭慢慢轉過去、慢慢加速減速，車子永遠往車頭的方向開
    const m0 = Math.hypot(vx, vz);
    if (m0 > 0.1) driving.heading = turnToward(driving.heading, Math.atan2(vx, vz), dt * 3);
    driving.v += ((m0 > 0.1 ? (onRoad ? 22 : 14) * m0 : 0) - driving.v) * Math.min(1, dt * 2);
    vx = Math.sin(driving.heading); vz = Math.cos(driving.heading); speed = driving.v;
  }
  const px = player.x, pz = player.z;
  player.x += vx * speed * dt; player.z += vz * speed * dt;
  const mag = Math.hypot(vx, vz);
  player.moving = driving ? driving.v > 0.5 : mag > 0.1;

  for (const h of houses) {
    const d = Math.hypot(player.x - h.x, player.z - h.z), min = h.r + 0.7;
    if (d < min && d > 0) { player.x = h.x + (player.x - h.x) / d * min; player.z = h.z + (player.z - h.z) / d * min; }
  }
  collideBoxes(player);
  if (driving) collideCar(driving);
  else {
    for (const c of cars) for (const q of carCircles(c)) pushCircle(player, q.x, q.z, CAR_R + 0.45);      // 走路也不能穿過車子
    for (const c of decor) pushCircle(player, c.x, c.z, c.r + 0.4);
    if (gary.active) pushCircle(player, gary.x, gary.z, 0.6 + 0.4);
    for (const n of npcs) if (n.out && !n.hero) pushCircle(player, n.x, n.z, 0.5 + 0.4);
  }
  if (!canWalk(player.x, player.z)) {
    if (canWalk(player.x, pz)) player.z = pz; else if (canWalk(px, player.z)) player.x = px; else { player.x = px; player.z = pz; }
  }

  // 轉向走的方向（走最短的那一邊轉過去）
  if (player.moving) {
    const target = Math.atan2(vx, vz);
    let diff = (target - player.heading) % TAU;
    if (diff > Math.PI) diff -= TAU; else if (diff < -Math.PI) diff += TAU;
    player.heading += diff * Math.min(1, dt * 12);
    player.walk += dt * heroNpc.rate * 1.3 * mag;
  }
  const hero = heroNpc.model;
  if (driving) player.heading = driving.heading;
  hero.root.position.set(player.x, groundH(player.x, player.z) + (driving ? 0.55 : 0), player.z);     // 坐在車裡：下半身在船身裡面
  hero.root.rotation.y = player.heading;
  animate(hero, player.walk, player.moving && !driving, t);
  updateCars(dt);
  const fe = jfE(player.x, player.z);
  if (inField ? fe > 1.0 : fe < 0.99) setInField(!inField);      // 穿過隱形門
  jfMistIn.visible = !inField && fe < 1.6 && jfE(camera.position.x, camera.position.z) >= 1; jfMistOut.visible = inField;
  mistTex.offset.x += dt * 0.004;
  updateNPCs(dt, t);
  updateGary(dt, t);
  updateKing(dt, t);
  if (!(cullTick = (cullTick + 1) % 15)) {
    for (const c of cullables) c.visible = inField && Math.hypot(c.position.x - focus.x, c.position.z - focus.z) < 95;
    for (const m of jfBig) m.visible = inField;
  }

  nearHouse = houses.find(h => Math.hypot(player.x - h.x, player.z - h.z) < h.r + 2.6)
    || places.find(p => Math.hypot(player.x - p.door.x, player.z - p.door.z) < 2.4) || null;
  nearNPC = npcs.find(n => n.out && !n.hero && Math.hypot(player.x - n.x, player.z - n.z) < 2.2) || (gary.active && Math.hypot(player.x - gary.x, player.z - gary.z) < 1.9 ? gary : null) || kings.find(k => Math.hypot(player.x - k.x, player.z - k.z) < 4.5 * (k.size ?? 1)) || null;
  nearCar = driving ? null : cars.find(c => carCircles(c).some(q => Math.hypot(player.x - q.x, player.z - q.z) < 2.5)) || null;
  const showPrompt = (driving || nearCar || nearNPC || nearHouse) && !dlg.open;
  promptEl.style.display = actBtn.style.display = showPrompt ? 'block' : 'none';
  if (driving || nearCar) {
    promptEl.textContent = driving ? '按 E / 空白鍵 下車' : '按 E / 空白鍵 上車';
    actBtn.textContent = driving ? '下車' : '上車';
  } else if (showPrompt) {
    promptEl.textContent = nearNPC ? `按 E / 空白鍵 跟「${nearNPC.name}」說話` : `按 E / 空白鍵 拜訪「${nearHouse.name}」`;
    actBtn.textContent = nearNPC ? '說話' : '拜訪';
  }

  for (const j of jellies) {
    j.ph += dt * 3;
    if (Math.random() < dt * 0.5) { j.vx = rand(-1.2, 1.2); j.vz = rand(-1.2, 1.2); }
    j.x += j.vx * dt; j.z += j.vz * dt;
    if (blocked(j, 0.8) || noJelly(j)) {
      j.x -= j.vx * dt; j.z -= j.vz * dt; j.vx *= -1; j.vz *= -1;
      if (blocked(j, 0.8) || noJelly(j)) placeJelly(j);
    }
    if (j.field) {
      if (jfE(j.x, j.z) > 0.9) {
        j.x -= j.vx * dt; j.z -= j.vz * dt; j.vx *= -1; j.vz *= -1;
        if (jfE(j.x, j.z) > 0.93) placeJelly(j);
      }
    } else {
      if (j.x < BOUNDS.x0 + 2 || j.x > BOUNDS.x1 - 2) j.vx *= -1;
      if (j.z < BOUNDS.z0 + 2 || j.z > BOUNDS.z1 - 2) j.vz *= -1;
    }
    j.g.visible = inField === j.field && Math.hypot(j.x - focus.x, j.z - focus.z) < 95;
    const y = groundH(j.x, j.z) + 1.5 + j.alt + Math.sin(j.ph) * 0.25;
    j.g.position.set(j.x, y, j.z);
    j.g.scale.y = 1 + Math.sin(j.ph * 2) * 0.12;
    if (j.alt < 1.2 && Math.hypot(j.x - player.x, j.z - player.z) < 1.2) {
      score += j.blue ? 5 : 1;
      document.getElementById('hud').textContent = `🪼 水母：${score}`;
      for (let k = 0; k < 12; k++) {
        const m = new THREE.Mesh(sparkGeo, sparkMat);
        m.position.set(j.x, y, j.z); scene.add(m);
        sparks.push({ m, vx: rand(-4, 4), vy: rand(1, 6), vz: rand(-4, 4), life: 0.7 });
      }
      placeJelly(j);
    }
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.vy -= 9 * dt; p.life -= dt;
    p.m.position.x += p.vx * dt; p.m.position.y += p.vy * dt; p.m.position.z += p.vz * dt;
    if (p.life <= 0) { scene.remove(p.m); sparks.splice(i, 1); }
  }
  for (const g of seaweeds) g.rotation.z = Math.sin(t * 1.5 + g.userData.ph) * 0.14;
  for (const b of bubbles) {
    b.position.y += b.userData.s * dt;
    b.visible = Math.hypot(b.position.x - TD.x, b.position.y, b.position.z - TD.z) > TD.r + 0.3;
    if (b.position.y > 14) { b.position.y = 0; b.position.x = player.x + rand(-25, 25); b.position.z = player.z + rand(-25, 20); }
  }

  // 鏡頭從後上方跟著，燈光也跟著才有影子
  const k = Math.min(1, dt * 5);
  focus.x += (player.x - focus.x) * k;
  focus.z += (player.z - focus.z) * k;
  zoom += (zoomTarget - zoom) * Math.min(1, dt * 10);
  const cd = CAM_DIST * zoom, ch = cd * Math.cos(camPitch);
  const gh = groundH(focus.x, focus.z);
  camera.position.set(focus.x + Math.sin(camYaw) * ch, gh + Math.max(0.6, cd * Math.sin(camPitch)), focus.z + Math.cos(camYaw) * ch);
  camera.lookAt(focus.x, gh + 1.2, focus.z);
  sky.position.set(camera.position.x, 0, camera.position.z);
  sun.position.set(player.x + 10, 26, player.z + 8);
  sun.target.position.set(player.x, 0, player.z);
}
camera.position.set(player.x + CAM_OFF.x, CAM_OFF.y, player.z + CAM_OFF.z);

// ---- 船車：比奇堡的車是一艘裝了四顆小輪子的小船。走到旁邊按 E 上車，再按一次下車 ----
function buildBoat([TOPC, BOTC, STRIPE]) {
  const g = new THREE.Group();
  // 船身是一片真正的曲面：從船尾到船頭切成很多個橫切面，每個切面都是「平底 → 往外張開的船舷」。
  // 越往船頭，船身越窄、船底越往上翹、船舷越高，最後在船頭收成一個往前伸的尖
  const L0 = -2.1, LEN = 4.7;
  const W = s => 1.15 * (s < 0.45 ? 0.93 + 0.07 * s / 0.45 : Math.pow(Math.max(0, 1 - Math.pow((s - 0.45) / 0.55, 2.2)), 0.6));   // 船舷的半寬
  const yTop = s => 1.3 + 0.38 * s * s * s;                                    // 船舷上緣的高度（船頭翹起來）
  const yBot = s => 0.42 + 0.8 * Math.pow(Math.max(0, (s - 0.45) / 0.55), 2.2);   // 船底的高度（船頭往上收）
  // s：0 船尾 → 1 船頭；v：-1 船底中線、0 船底邊緣 → 1 船舷上緣；side：左或右
  const P = (s, v, side) => {
    if (v < 0) return [0, yBot(s), L0 + LEN * s];
    return [side * W(s) * (0.6 + 0.4 * Math.pow(v, 0.7)), yBot(s) + (yTop(s) - yBot(s)) * v, L0 + LEN * s + 0.55 * v * s * s];
  };
  const grid = (nI, nJ, fn, col) => {
    const pos = [], idx = [];
    for (let i = 0; i <= nI; i++) for (let j = 0; j <= nJ; j++) pos.push(...fn(i / nI, j / nJ));
    for (let i = 0; i < nI; i++) for (let j = 0; j < nJ; j++) {
      const a = i * (nJ + 1) + j, b = a + nJ + 1;
      idx.push(a, b, a + 1, a + 1, b, b + 1);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setIndex(idx); geo.computeVertexNormals();
    return add(g, geo, mat(col, { side: THREE.DoubleSide }));
  };
  const NS = 30;
  const band = (v0, v1, col) => {                      // 船身上的一條色帶（左右兩邊 + 船尾那一面）
    for (const side of [-1, 1]) grid(NS, 5, (a, b) => P(a, v0 + (v1 - v0) * b, side), col);
    grid(1, 5, (a, b) => P(0, v0 + (v1 - v0) * b, a ? 1 : -1), col);
  };
  for (const side of [-1, 1]) grid(NS, 1, (a, b) => P(a, b ? 0 : -1, side), BOTC);      // 平的船底
  band(0, STRIPE ? 0.44 : 0.5, BOTC);
  if (STRIPE) band(0.44, 0.58, STRIPE);
  band(STRIPE ? 0.58 : 0.5, 1, TOPC);
  // 甲板：整片蓋住船身上面；中間後段是深色的座艙
  grid(NS, 1, (a, b) => { const p = P(a, 1, b ? 1 : -1); p[1] -= 0.02; return p; }, TOPC).castShadow = false;
  grid(14, 1, (a, b) => { const p = P(0.05 + 0.56 * a, 1, b ? 1 : -1); p[0] *= 0.8; p[1] += 0.012; return p; }, '#3a4658').castShadow = false;
  // 船舷上緣一圈圓邊
  for (const side of [-1, 1]) {
    const rail = [];
    for (let i = 0; i <= NS; i++) { const p = P(i / NS, 1, side); rail.push(new THREE.Vector3(p[0], p[1], p[2])); }
    add(g, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(rail), 60, 0.045, 6), TOPC).castShadow = false;
  }

  // 座椅：矮矮的長椅 + 椅背
  add(g, new THREE.BoxGeometry(1.5, 0.14, 0.6), '#a8552e', 0, 1.36, -0.6);
  add(g, new THREE.BoxGeometry(1.5, 0.42, 0.14), '#a8552e', 0, 1.56, -0.95).rotation.x = -0.15;
  // 擋風玻璃（有一圈銀色窗框）、方向盤
  const wsY = yTop(0.65);
  const glass = add(g, new THREE.BoxGeometry(1.7, 0.58, 0.05), mat('#bfe8ff', { transparent: true, opacity: 0.4 }), 0, wsY + 0.3, 0.92);
  glass.rotation.x = -0.4; glass.castShadow = false;
  const bar = (w, hh, x, y, z) => { add(g, new THREE.BoxGeometry(w, hh, 0.07), '#d8dde2', x, y, z).rotation.x = -0.4; };
  bar(1.8, 0.06, 0, wsY + 0.02, 1.03); bar(1.8, 0.06, 0, wsY + 0.57, 0.81);
  for (const x of [-0.88, 0.88]) bar(0.06, 0.6, x, wsY + 0.3, 0.92);
  const sw = new THREE.Group(); sw.position.set(0, wsY + 0.27, 0.48); sw.rotation.x = 0.6; g.add(sw);      // 盤面朝向駕駛、稍微往後仰
  add(sw, new THREE.TorusGeometry(0.22, 0.036, 12, 32), '#2b2b30');
  for (let i = 0; i < 3; i++) {
    const a = Math.PI / 2 + i * TAU / 3, spoke = add(sw, new THREE.BoxGeometry(0.2, 0.04, 0.025), '#c8ccd2', Math.cos(a) * 0.12, Math.sin(a) * 0.12, 0);
    spoke.rotation.z = a;
  }
  add(sw, new THREE.CylinderGeometry(0.07, 0.07, 0.05, 18), '#2b2b30').rotation.x = Math.PI / 2;
  add(sw, new THREE.CylinderGeometry(0.045, 0.045, 0.06, 14), '#d42a2a', 0, 0, -0.005).rotation.x = Math.PI / 2;
  add(sw, new THREE.CylinderGeometry(0.032, 0.04, 0.46, 10), '#8a9098', 0, 0, 0.25).rotation.x = Math.PI / 2;
  add(g, new THREE.BoxGeometry(1.5, 0.16, 0.26), '#e8ecef', 0, wsY + 0.05, 0.86);                           // 儀表板
  for (const x of [-0.35, 0.35]) add(g, new THREE.CylinderGeometry(0.07, 0.07, 0.02, 14), '#2b2b30', x, wsY + 0.1, 0.725).rotation.x = Math.PI / 2 - 0.3;
  // 船尾的小引擎箱 + 天線
  add(g, new THREE.BoxGeometry(0.7, 0.3, 0.45), BOTC, -0.3, 1.46, -1.7);
  add(g, new THREE.CylinderGeometry(0.018, 0.018, 1.2, 5), '#555', -0.55, 2.0, -1.7).rotation.z = 0.12;
  add(g, new THREE.SphereGeometry(0.045, 6, 5), '#d42a2a', -0.62, 2.6, -1.7);
  // 船頭甲板上的小喇叭：一根短柱子上面橫著一支往前開口的喇叭
  const hy = yTop(0.86);
  add(g, new THREE.CylinderGeometry(0.03, 0.03, 0.22, 6), '#8a9098', 0.3, hy + 0.1, 1.95);
  add(g, new THREE.CylinderGeometry(0.035, 0.035, 0.28, 8), '#8a9098', 0.3, hy + 0.22, 2.0).rotation.x = Math.PI / 2;
  add(g, new THREE.CylinderGeometry(0.13, 0.04, 0.2, 12, 1, true), mat('#aab0b8', { side: THREE.DoubleSide }), 0.3, hy + 0.22, 2.22).rotation.x = Math.PI / 2;
  // 四顆小輪子
  const wheels = [];
  for (const x of [-1, 1]) for (const z of [-1.3, 1.1]) {
    const w = add(g, new THREE.CylinderGeometry(0.34, 0.34, 0.24, 18), '#1a1a1a', x * 0.86, 0.34, z); w.rotation.z = Math.PI / 2;
    add(w, new THREE.CylinderGeometry(0.14, 0.14, 0.26, 10), '#9aa0a8');
    wheels.push(w);
  }
  scene.add(g);
  return { g, wheels };
}
const cars = [
  [-112, -76, Math.PI, ['#ffffff', '#d42a2a', null]],            // 水母田門口
  [18.5, 5.5, Math.PI / 2, ['#f4f4f4', '#d42a2a', '#1a1a1a']],   // 鳳梨屋旁邊

  [SC.x + SC.gate - 8, SC.z + 9, 0, ['#ffffff', '#d42a2a', null]],           // 駕訓班的教練車
  [SC.x + SC.gate + 8, SC.z + 9, 0, ['#f4f4f4', '#2f6fd0', '#1a1a1a']],

let driving = null, nearCar = null;
// 車子的碰撞：車身很長，用沿著車身排的三個圓來代表（車尾、中間、車頭）
const CAR_R = 1.15, CAR_OFF = [-0.95, 0.5, 1.9];
const carCircles = c => CAR_OFF.map(o => ({ x: c.x + Math.sin(c.heading) * o, z: c.z + Math.cos(c.heading) * o }));
function pushCircle(p, x, z, min) {
  const d = Math.hypot(p.x - x, p.z - z);
  if (d < min && d > 0) { p.x = x + (p.x - x) / d * min; p.z = z + (p.z - z) / d * min; }
}
// 把半徑 r 的圓 p 推到所有障礙物外面：房子、圓形建築、方形建築和矮牆、其他車子
function pushOut(p, r, skipCar) {
  for (const h of houses) pushCircle(p, h.x, h.z, h.r + 0.2 + r);
  for (const c of circles) pushCircle(p, c.x, c.z, c.r + r);
  for (const c of decor) pushCircle(p, c.x, c.z, c.r + r);
  if (gary.active) pushCircle(p, gary.x, gary.z, 0.6 + r);
  for (const n of npcs) if (n.out && !n.hero) pushCircle(p, n.x, n.z, 0.5 + r);
  for (const b of boxes) {
    const dx = p.x - b.x, dz = p.z - b.z, px = b.hw + r - Math.abs(dx), pz = b.hd + r - Math.abs(dz);
    if (px > 0 && pz > 0) { if (px < pz) p.x += px * Math.sign(dx || 1); else p.z += pz * Math.sign(dz || 1); }
  }
  for (const c of cars) if (c !== skipCar) for (const q of carCircles(c)) pushCircle(p, q.x, q.z, CAR_R + r);
}
// 開車時：三個圓只要有一個撞到東西，整台車就被推開，車速也會掉下來
function collideCar(c) {
  let hit = false;
  for (let pass = 0; pass < 2; pass++) for (const o of CAR_OFF) {
    const bx = player.x + Math.sin(c.heading) * o, bz = player.z + Math.cos(c.heading) * o, q = { x: bx, z: bz };
    pushOut(q, CAR_R, c);
    if (q.x !== bx || q.z !== bz) { player.x += q.x - bx; player.z += q.z - bz; hit = true; }
  }
  if (hit) c.v *= 0.9;
}
function enterCar(c) { driving = c; c.v = 0; player.x = c.x; player.z = c.z; player.heading = c.heading; }
function exitCar() {
  const c = driving; driving = null; c.v = 0; c.x = player.x; c.z = player.z;
  for (const side of [1, -1, 0]) {                   // 下車站在車子左邊；左邊不能站就右邊，再不行就車尾
    const a = c.heading + side * Math.PI / 2 + (side ? 0 : Math.PI), d = side ? 2.1 : 3.2;
    const p = { x: c.x + Math.sin(a) * d, z: c.z + Math.cos(a) * d };
    if (canWalk(p.x, p.z) && !blocked(p, 0.3)) { player.x = p.x; player.z = p.z; break; }
  }
}
function updateCars(dt) {
  if (!driving) return;
  const c = driving; c.x = player.x; c.z = player.z;
  c.g.position.set(c.x, groundH(c.x, c.z), c.z); c.g.rotation.y = c.heading;
  for (const w of c.wheels) w.rotation.x += c.v * dt / 0.34;
}

// ---- 隱形門 ----
// 水母田被一圈神祕的黑霧圍住：底下濃、越往上越淡，霧裡有深淺不一的霧團，會慢慢飄。
// 在外面時霧貼著草地邊界（擋住裡面）；在田裡時霧退到草地外面一段距離（擋住外面的世界），所以兩邊看過去都是霧
const mistTex = canvasTex(512, 256, (c, w, h) => {
  const g = c.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, 'rgba(46,32,90,0)'); g.addColorStop(0.3, 'rgba(34,24,72,0.5)'); g.addColorStop(0.62, 'rgba(16,11,40,0.9)'); g.addColorStop(1, 'rgba(6,4,18,0.98)');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  const rnd = i => { const v = Math.sin(i * 127.1) * 43758.5453; return v - Math.floor(v); };
  for (let i = 0; i < 70; i++) {
    const x = rnd(i * 3 + 1) * w, y = h * (0.12 + 0.8 * rnd(i * 5 + 2)), r = 26 + rnd(i * 7 + 3) * 60;
    for (const ox of [0, w, -w]) {                    // 靠邊的霧團在另一邊再畫一次，繞一圈才接得起來
      const rg = c.createRadialGradient(x + ox, y, 0, x + ox, y, r);
      rg.addColorStop(0, i % 3 ? 'rgba(96,74,160,0.22)' : 'rgba(0,0,0,0.35)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = rg; c.beginPath(); c.arc(x + ox, y, r, 0, 6.2832); c.fill();
    }
  }
});
mistTex.wrapS = THREE.RepeatWrapping; mistTex.repeat.set(8, 1);
const mistGeo = (() => {
  const N = 140, TOP = 75, pos = [], uv = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const th = i / N * TAU, r = 1 / (1 + 0.06 * Math.sin(5 * th));
    pos.push(Math.cos(th) * JF.rx * r, -1, Math.sin(th) * JF.rz * r, Math.cos(th) * JF.rx * r, TOP, Math.sin(th) * JF.rz * r);
    uv.push(i / N, 0, i / N, 1);
    if (i < N) idx.push(i * 2, i * 2 + 2, i * 2 + 1, i * 2 + 1, i * 2 + 2, i * 2 + 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx);
  return g;
})();
const mistRing = (scale, fog) => {
  const m = new THREE.Mesh(mistGeo, new THREE.MeshBasicMaterial({ map: mistTex, transparent: true, side: THREE.DoubleSide, depthWrite: false, fog }));
  m.position.set(JF.x, 0, JF.z); m.scale.set(scale, 1, scale); m.renderOrder = 5; m.visible = false;
  scene.add(m);
  return m;
};
const jfMistIn = mistRing(1, true), jfMistOut = mistRing(1.3, false);       // 在外面時看到的那一圈 / 在田裡時看到的那一圈
// 比奇堡那一邊的所有東西（房子、道路、蟹堡王……）：人在水母田裡的時候全部藏起來
const townObjs = (() => {
  const keep = new Set([...cars.map(c => c.g), ground, sky, sun.target, jfMistIn, jfMistOut, king.g, king2.g, gary.model.root, ...jfBig, ...jfKeep, ...cullables, ...bubbles,
    ...jellies.map(j => j.g), ...npcs.map(n => n.model.root), ...slimes.map(sl => sl.m)]);
  return (scene.children || []).filter(o => !o.isLight && o.visible && !keep.has(o));
})();
function setInField(v) {
  inField = v; cullTick = 14;
  if (!v) camYaw = Math.atan2(JF.x - player.x, JF.z - player.z);      // 走出來：鏡頭立刻轉到背對水母田、面向外面
  for (const o of townObjs) o.visible = !v;
  const f = document.getElementById('fade');           // 畫面先全黑，再慢慢亮起來
  f.style.transition = 'none'; f.style.opacity = 1;
  setTimeout(() => { f.style.transition = 'opacity .8s'; f.style.opacity = 0; }, 80);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt, now / 1000);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
